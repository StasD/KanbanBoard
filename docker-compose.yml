services:

  db:
    image: postgres:18.1-trixie
    ports:
      - 127.0.0.1:5032:5432
    restart: no
    volumes:
      - ./data/pg/data:/var/lib/postgresql/data
      - ./data/pg/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./data/pg/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
      - ./data/pg/ssl:/etc/postgresql/ssl
    command: >
      bash -c "chown postgres /etc/postgresql/ssl/server.key
      && exec su -c 'chmod 600 /etc/postgresql/ssl/server.key
      && /usr/local/bin/docker-entrypoint.sh postgres
      -c ssl=on
      -c ssl_cert_file=/etc/postgresql/ssl/server.crt
      -c ssl_key_file=/etc/postgresql/ssl/server.key
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c max_connections=200' postgres"
    env_file:
      - ./data/pg/.env
    networks:
      default:
        aliases:
          - db.kanbanboard.net
    mem_limit: 2048m
    shm_size: 128mb
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "robot", "-d", "kanban_board"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4.2.3-management
    hostname: rabbitmq-1
    ports:
      - 127.0.0.1:5671:5671
      - 127.0.0.1:15671:15671
    restart: no
    volumes:
      - ./data/rabbitmq/ssl:/etc/rabbitmq/ssl
      - ./data/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./data/rabbitmq/data/rabbitmq:/var/lib/rabbitmq
    env_file:
      - ./data/rabbitmq/.env
    networks:
      default:
        aliases:
          - rabbitmq.kanbanboard.net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: mcr.microsoft.com/dotnet/aspnet:10.0.2-noble
    ports:
      - 127.0.0.1:7003:7003
    restart: no
    working_dir: /app
    entrypoint: >
      bash -c "chown app /ssl/server.key
      && exec su -c 'chmod 600 /ssl/server.key
      && dotnet KanbanBoardApi.dll' app"
    volumes:
      - ./KanbanBoardApi/publish:/app:ro
      - ./data/api/ssl:/ssl
    env_file:
      - ./KanbanBoardApi/.env
    networks:
      default:
        aliases:
          - api.kanbanboard.net
    mem_limit: 1024m
    shm_size: 128mb
    depends_on:
      rabbitmq:
        condition: service_healthy
      db:
        condition: service_healthy

  app:
    image: nginx:1.29.4-trixie
    ports:
      - 443:443
    restart: no
    volumes:
      - ./kanban-board-app/dist:/usr/share/nginx/html:ro
      - ./data/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/nginx/logs:/var/log/nginx/logs
      - ./data/nginx/ssl:/etc/nginx/ssl
    networks:
      default:
        aliases:
          - kanbanboard.net
          - www.kanbanboard.net
    depends_on:
      api:
        condition: service_started

  mail:
    image: rnwood/smtp4dev:3.12.0
    ports:
      - 127.0.0.1:8180:80
      - 127.0.0.1:8125:25
    restart: no
    volumes:
      - ./data/mail/data:/smtp4dev
      - ./data/mail/DataProtectionKeys:/root/.aspnet/DataProtection-Keys
      - ./data/mail/ssl:/ssl
    environment:
      - ServerOptions__TlsMode=ImplicitTls
      - ServerOptions__TlsCertificate=/ssl/server.crt
      - ServerOptions__TlsCertificatePrivateKey=/ssl/server.key
      - ServerOptions__SecureConnectionRequired=true
    networks:
      default:
        aliases:
          - mail.kanbanboard.net
